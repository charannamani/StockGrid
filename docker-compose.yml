services:
  redis:
    image: redis:alpine
    container_name: stockgrid-redis
    ports:
      - "6379:6379"
    restart: always

  server:
    build:
      context: ./server
      target: development
    container_name: stockgrid-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./server/.env
    depends_on:
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      target: development
    container_name: stockgrid-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules