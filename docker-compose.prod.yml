services:
  redis:
    image: redis:alpine
    container_name: stockgrid-redis
    ports:
      - "6379:6379"
    restart: always

  server:
    build:
      context: ./server
      target: production
    container_name: stockgrid-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./server/.env
    depends_on:
      - redis
    restart: always

  client:
    build:
      context: ./client
      target: production
    container_name: stockgrid-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always
